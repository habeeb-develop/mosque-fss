{% extends "base.html" %}

{% block title %}Verify Account | FSSSMC Central Mosque{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="page-eyebrow">
                Account Verification
            </div>

            <h1>
                Verify Your Account
            </h1>

            <p>
                Enter the verification code sent to your email
                address.
            </p>

        </div>


        <form method="POST">

            <div class="form-group">

                <label for="code">
                    Verification Code
                </label>

                <input
                    type="text"
                    id="code"
                    name="code"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    placeholder="Enter verification code"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary auth-submit"
            >
                Verify Account
            </button>

        </form>


        <div class="auth-footer">

            Didn't receive a code?

            <a href="{{ url_for('login') }}">
                Return to Sign In
            </a>

        </div>

    </div>

</section>

{% endblock %}
