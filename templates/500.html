{% extends "base.html" %}

{% block title %}
Server Error
{% endblock %}

{% block content %}

<section class="error-page">

    <div class="container">

        <span class="eyebrow">
            ERROR 500
        </span>

        <h1>
            Something went wrong
        </h1>

        <p>
            The server encountered an unexpected error.
        </p>

        <a
            href="{{ url_for('home') }}"
            class="btn btn-green"
        >
            Back Home
        </a>

    </div>

</section>

{% endblock %}
