{% extends "base.html" %}

{% block title %}My Profile | FSSSMC Central Mosque{% endblock %}

{% block content %}

<section class="page-hero">

    <div class="container">

        <div class="page-eyebrow">
            My Account
        </div>

        <h1>
            Profile
        </h1>

        <p>
            Manage your community account information.
        </p>

    </div>

</section>


<section class="section">

    <div class="container">

        <div class="profile-layout">

            <aside class="profile-sidebar">

                <div class="page-eyebrow">
                    Account
                </div>

                <h3>
                    My Profile
                </h3>


                <nav class="profile-nav">

                    <a href="#" class="active">
                        Profile
                    </a>

                    <a href="{{ url_for('index') }}">
                        Home
                    </a>

                    <a href="{{ url_for('contact') }}">
                        Contact
                    </a>

                </nav>

            </aside>


            <div class="profile-content">

                <div class="form-card">

                    <div class="section-heading">

                        <div class="page-eyebrow">
                            Personal Information
                        </div>

                        <h2>
                            Account Details
                        </h2>

                    </div>


                    <div class="form-grid">

                        <div class="form-group">

                            <label>
                                Full Name
                            </label>

                            <input
                                type="text"
                                value="{{ user.name if user else '' }}"
                                readonly
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                Email Address
                            </label>

                            <input
                                type="email"
                                value="{{ user.email if user else '' }}"
                                readonly
                            >

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
