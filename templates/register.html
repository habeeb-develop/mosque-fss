{% extends "base.html" %}
{% block title %}Create Account | FSSSMC Central Mosque{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="brand-mini">
            <img src="{{ url_for('static', filename='images/fsssmc.jpeg') }}" alt="FSSSMC logo">
            <div>
                <strong>FSSSMC</strong>
                <small>Central Mosque</small>
            </div>
        </div>
        <h1>Create account</h1>
        <p class="auth-note">Create your community account.</p>

        <form class="form-layout" method="post">
            <div class="form-group">
                <label for="name">First name</label>
                <input id="name" name="name" required autocomplete="given-name">
            </div>
            <div class="form-group">
                <label for="surname">Surname</label>
                <input id="surname" name="surname" required autocomplete="family-name">
            </div>
            <div class="form-group full">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm password</label>
                <input id="confirm_password" name="confirm_password" type="password" minlength="8" required autocomplete="new-password">
            </div>
            <div class="form-actions">
                <button class="btn btn-green" type="submit">Create Account</button>
            </div>
        </form>

        <p class="auth-note">
            Already have an account?
            <a href="{{ url_for('login') }}">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
