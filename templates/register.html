{% extends "base.html" %}

{% block title %}Register | FSSSMC Central Mosque{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="page-eyebrow">
                Join FSSSMC
            </div>

            <h1>
                Create Account
            </h1>

            <p>
                Register to become part of the FSSSMC community.
            </p>

        </div>


        <form method="POST">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group mt-3">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group mt-3">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group mt-3">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary auth-submit"
            >
                Create Account
            </button>

        </form>


        <div class="auth-footer">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Sign In
            </a>

        </div>

    </div>

</section>

{% endblock %}
