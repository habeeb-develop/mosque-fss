{% extends "base.html" %}

{% block title %}Sign In | FSSSMC Central Mosque{% endblock %}

{% block content %}

<div class="auth-wrap">

<div class="auth-card">

    <div class="brand-mini">

        <img
            src="{{ url_for('static', filename='images/fsssmc.jpeg') }}"
            alt="FSSSMC logo"
        >

        <div>
            <strong>FSSSMC</strong>
            <small>Central Mosque</small>
        </div>

    </div>

    <h1>Sign in</h1>

    <p class="auth-note">
        Access your mosque community account.
    </p>


    <form
        class="form-layout"
        method="post"
    >

        <div class="form-group full">

            <label for="email">
                Email address
            </label>

            <input
                id="email"
                name="email"
                type="email"
                required
                autocomplete="email"
            >

        </div>


        <div class="form-group full">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                required
                autocomplete="current-password"
            >

        </div>


        <div class="form-actions">

            <button
                class="btn btn-green"
                type="submit"
            >
                Sign In
            </button>

        </div>

    </form>


    <p class="auth-note">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Create an account
        </a>

    </p>

</div>


</div>

{% endblock %}
