{% extends "base.html" %}

{% block title %}Sign In | FSSSMC Central Mosque{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="page-eyebrow">
                FSSSMC Community
            </div>

            <h1>
                Welcome Back
            </h1>

            <p>
                Sign in to access your account.
            </p>

        </div>


        <form method="POST">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group mt-3">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary"
                style="width:100%; margin-top:24px;"
            >
                Sign In
            </button>

        </form>


        <div class="auth-footer">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create one
            </a>

        </div>

    </div>

</section>

{% endblock %}
